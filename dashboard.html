<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Panel Admin — Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    [data-theme="dark"] {
      --bg: #0a0a0f; --surface: #12121a; --surface2: #1a1a25;
      --border: #1e1e2e; --accent: #e94560; --text: #e8e8f0;
      --muted: #555570; --success: #4ade80; --warning: #facc15; --error: #f87171;
      --grid-color: rgba(233,69,96,0.02);
    }
    [data-theme="light"] {
      --bg: #f4f4f8; --surface: #ffffff; --surface2: #f0f0f5;
      --border: #dddde8; --accent: #e94560; --text: #1a1a2e;
      --muted: #888899; --success: #16a34a; --warning: #d97706; --error: #dc2626;
      --grid-color: rgba(233,69,96,0.03);
    }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; min-height: 100vh; transition: background 0.3s, color 0.3s; }
    body::before { content: ''; position: fixed; inset: 0; background-image: linear-gradient(var(--grid-color) 1px, transparent 1px), linear-gradient(90deg, var(--grid-color) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; }
    nav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; height: 60px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; transition: background 0.3s; }
    .nav-logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 16px; letter-spacing: 0.05em; text-transform: uppercase; }
    .nav-logo span { color: var(--accent); }
    .nav-right { display: flex; align-items: center; gap: 10px; }
    .admin-badge { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--muted); letter-spacing: 0.1em; display: none; }
    @media(min-width: 600px) { .admin-badge { display: block; } }
    .nav-btn { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 6px 12px; border-radius: 2px; font-family: 'Space Mono', monospace; font-size: 10px; cursor: pointer; text-transform: uppercase; transition: all 0.2s; white-space: nowrap; }
    .nav-btn:hover { border-color: var(--accent); color: var(--accent); }
    .theme-btn { font-size: 16px; padding: 6px 10px; border: 1px solid var(--border); background: transparent; border-radius: 2px; cursor: pointer; transition: all 0.2s; }
    .theme-btn:hover { border-color: var(--accent); }
    .tabs { display: flex; margin-bottom: 24px; border-bottom: 1px solid var(--border); overflow-x: auto; }
    .tab { background: transparent; border: none; color: var(--muted); padding: 10px 16px; font-family: 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    main { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
    @media(min-width: 600px) { main { padding: 40px 24px; } }
    .page-header { margin-bottom: 24px; }
    h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 4px; }
    @media(min-width: 600px) { h1 { font-size: 28px; } }
    .page-sub { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }
    .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 2px; padding: 14px 16px; position: relative; overflow: hidden; transition: background 0.3s; }
    .stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; }
    .stat-card.green::before { background: var(--success); }
    .stat-card.yellow::before { background: var(--warning); }
    .stat-card.red::before { background: var(--error); }
    .stat-label { font-family: 'Space Mono', monospace; font-size: 8px; color: var(--muted); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 6px; }
    .stat-value { font-size: 24px; font-weight: 800; }
    @media(min-width: 600px) { .stat-value { font-size: 28px; } }
    .stat-card.green .stat-value { color: var(--success); }
    .stat-card.yellow .stat-value { color: var(--warning); }
    .stat-card.red .stat-value { color: var(--error); }
    .users-topbar { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    @media(min-width: 700px) { .users-topbar { flex-direction: row; align-items: center; } }
    .users-topbar-left { display: flex; gap: 8px; align-items: center; flex: 1; flex-wrap: wrap; }
    .users-topbar-right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .search-input, .add-input, #sortSelect { background: var(--surface); border: 1px solid var(--border); border-radius: 2px; padding: 8px 12px; color: var(--text); font-family: 'Space Mono', monospace; font-size: 11px; outline: none; transition: border-color 0.2s, background 0.3s; }
    .search-input { flex: 1; min-width: 140px; }
    .add-input { flex: 1; min-width: 140px; }
    .search-input:focus, .add-input:focus, #sortSelect:focus { border-color: var(--accent); }
    .search-input::placeholder, .add-input::placeholder { color: var(--muted); }
    #sortSelect { cursor: pointer; }
    #sortSelect option { background: var(--surface); color: var(--text); }
    .add-msg { font-family: 'Space Mono', monospace; font-size: 11px; min-height: 16px; margin-bottom: 8px; }
    .btn { padding: 7px 12px; border-radius: 2px; font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.05em; cursor: pointer; border: 1px solid; transition: all 0.2s; text-transform: uppercase; white-space: nowrap; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: white; border-color: var(--accent); }
    .btn-primary:hover { background: #c73652; }
    .btn-outline { background: transparent; color: var(--muted); border-color: var(--border); }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
    .btn-success { background: transparent; border-color: var(--success); color: var(--success); }
    .btn-success:hover:not(:disabled) { background: rgba(74,222,128,0.1); }
    .btn-warning { background: transparent; border-color: var(--warning); color: var(--warning); }
    .btn-warning:hover:not(:disabled) { background: rgba(250,204,21,0.1); }
    .btn-danger { background: transparent; border-color: var(--error); color: var(--error); }
    .btn-danger:hover:not(:disabled) { background: rgba(248,113,113,0.1); }
    .btn-purple { background: transparent; border-color: #a78bfa; color: #a78bfa; }
    .btn-purple:hover:not(:disabled) { background: rgba(167,139,250,0.1); }
    .btn-cyan { background: transparent; border-color: #22d3ee; color: #22d3ee; }
    .btn-cyan:hover:not(:disabled) { background: rgba(34,211,238,0.1); }
    .btn-nota { background: rgba(137,180,250,0.1); border-color: #89b4fa; color: #89b4fa; }
    .btn-nota:hover { background: rgba(137,180,250,0.2); }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 2px; margin-bottom: 16px; transition: background 0.3s; }
    .card-header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .card-title { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--muted); letter-spacing: 0.15em; text-transform: uppercase; }
    .users-list { padding: 4px 0; }
    .user-row { padding: 12px 16px; border-bottom: 1px solid var(--border); transition: background 0.15s; }
    @media(min-width: 600px) { .user-row { padding: 14px 24px; } }
    .user-row:last-child { border-bottom: none; }
    .user-row:hover { background: var(--surface2); }
    .user-top { display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
    .user-avatar { width: 32px; height: 32px; border-radius: 2px; background: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; color: white; flex-shrink: 0; }
    .user-main { flex: 1; min-width: 100px; }
    .user-name { font-weight: 700; font-size: 14px; }
    .user-note { font-family: 'Space Mono', monospace; font-size: 11px; color: #89b4fa; margin-top: 2px; font-weight: 700; }
    .user-bottom { display: flex; align-items: center; gap: 12px; margin-top: 8px; padding-left: 42px; flex-wrap: wrap; }
    .user-meta-item { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
    .user-meta-item span { color: var(--text); opacity: 0.7; }
    .timer-badge { font-family: 'Space Mono', monospace; font-size: 10px; padding: 3px 8px; border-radius: 2px; background: rgba(250,204,21,0.08); color: var(--warning); border: 1px solid rgba(250,204,21,0.15); }
    .timer-badge.urgent { background: rgba(248,113,113,0.08); color: var(--error); border-color: rgba(248,113,113,0.15); }
    .status-badge { font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 8px; border-radius: 2px; white-space: nowrap; flex-shrink: 0; }
    .badge-active { background: rgba(74,222,128,0.1); color: var(--success); border: 1px solid rgba(74,222,128,0.2); }
    .badge-inuse { background: rgba(250,204,21,0.1); color: var(--warning); border: 1px solid rgba(250,204,21,0.2); }
    .badge-inactive { background: rgba(248,113,113,0.1); color: var(--error); border: 1px solid rgba(248,113,113,0.2); }
    .user-actions { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 4px; width: 100%; }
    @media(min-width: 700px) { .user-actions { width: auto; margin-top: 0; } }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; padding: 16px; }
    .modal-overlay.show { opacity: 1; pointer-events: all; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 2px; padding: 24px; width: 100%; max-width: 400px; position: relative; transition: background 0.3s; }
    .modal::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--accent), transparent); }
    .modal h3 { font-size: 16px; font-weight: 800; margin-bottom: 16px; }
    .modal textarea { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 2px; padding: 10px 14px; color: var(--text); font-family: 'Space Mono', monospace; font-size: 12px; outline: none; resize: vertical; min-height: 80px; transition: border-color 0.2s, background 0.3s; }
    .modal textarea:focus { border-color: var(--accent); }
    .modal-actions { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }
    .chart-container { padding: 20px; overflow-x: auto; }
    .chart-inner { min-width: 400px; }
    .chart-bars { display: flex; align-items: flex-end; gap: 4px; height: 120px; margin-bottom: 6px; }
    .chart-bar-wrap { display: flex; flex-direction: column; align-items: center; flex: 1; height: 100%; justify-content: flex-end; }
    .chart-bar { width: 100%; background: var(--accent); border-radius: 2px 2px 0 0; min-height: 2px; transition: height 0.5s cubic-bezier(0.16,1,0.3,1); opacity: 0.8; }
    .chart-bar:hover { opacity: 1; }
    .chart-bar-val { font-family: 'Space Mono', monospace; font-size: 8px; color: var(--muted); margin-bottom: 3px; }
    .chart-empty { text-align: center; padding: 40px; font-family: 'Space Mono', monospace; font-size: 12px; color: var(--muted); }
    .empty-state, .loading-state { text-align: center; padding: 40px 24px; color: var(--muted); font-family: 'Space Mono', monospace; font-size: 12px; }
    .spinner { width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .log-row { display: flex; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--border); font-family: 'Space Mono', monospace; font-size: 10px; gap: 10px; flex-wrap: wrap; }
    @media(min-width: 600px) { .log-row { font-size: 11px; padding: 10px 24px; gap: 16px; flex-wrap: nowrap; } }
    .log-row:last-child { border-bottom: none; }
    .log-row:hover { background: var(--surface2); }
    .log-user { color: var(--accent); font-weight: 700; min-width: 100px; }
    .log-action { min-width: 70px; }
    .log-action.login { color: var(--success); }
    .log-action.ocultar { color: #a78bfa; }
    .log-action.mostrar { color: #22d3ee; }
    .log-action.cerrar { color: var(--error); }
    .log-date { color: var(--muted); font-size: 10px; flex: 1; }
    .log-ip { color: #a78bfa; font-size: 10px; }
    .reset-bar { background: rgba(233,69,96,0.05); border: 1px solid rgba(233,69,96,0.2); border-radius: 2px; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 12px; flex-wrap: wrap; }
    .reset-bar-text { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--muted); }
    .toast { position: fixed; bottom: 16px; right: 16px; left: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 2px; padding: 12px 20px; font-family: 'Space Mono', monospace; font-size: 12px; transform: translateY(80px); opacity: 0; transition: all 0.3s cubic-bezier(0.16,1,0.3,1); z-index: 999; text-align: center; }
    @media(min-width: 500px) { .toast { left: auto; width: auto; max-width: 360px; text-align: left; } }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { border-left: 3px solid var(--success); color: var(--success); }
    .toast.error { border-left: 3px solid var(--error); color: var(--error); }
  </style>
</head>
<body>
  <nav>
    <div class="nav-logo">🛡️ OCULT<span>ADOR</span></div>
    <div class="nav-right">
      <span class="admin-badge" id="adminEmail">—</span>
      <button class="theme-btn" id="themeBtn" onclick="toggleTema()" title="Cambiar tema">🌙</button>
      <button class="nav-btn" onclick="logout()">Salir</button>
    </div>
  </nav>

  <main>
    <div class="page-header">
      <h1>Panel de administración</h1>
      <p class="page-sub">Gestión de usuarios y actividad</p>
    </div>

    <div class="stats-row">
      <div class="stat-card green"><div class="stat-label">Activos</div><div class="stat-value" id="statActivos">—</div></div>
      <div class="stat-card yellow"><div class="stat-label">En uso</div><div class="stat-value" id="statEnUso">—</div></div>
      <div class="stat-card red"><div class="stat-label">Inactivos</div><div class="stat-value" id="statInactivos">—</div></div>
    </div>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('usuarios', this)">Usuarios</button>
      <button class="tab" onclick="switchTab('grafico', this)">Gráfico</button>
      <button class="tab" onclick="switchTab('logs', this)">Logs</button>
    </div>

    <div class="tab-content active" id="tab-usuarios">
      <div class="reset-bar">
      <span class="reset-bar-text">⚡ Gestión masiva de usuarios</span>
    
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-warning" onclick="resetearTodos()">
          ↺ Resetear todos
        </button>
    
        <button class="btn btn-danger" onclick="eliminarTodosUsuarios()">
          🗑 Eliminar todos
        </button>
      </div>
</div>
      <div class="users-topbar">
        <div class="users-topbar-left">
          <input type="text" class="search-input" id="searchInput" placeholder="🔍 Buscar..." oninput="filtrarUsuarios()" />
          <select id="sortSelect" onchange="ordenarUsuarios()">
            <option value="nombre">A→Z</option>
            <option value="usos">Más usos</option>
            <option value="ultimo_uso">Último uso</option>
            <option value="estado">Por estado</option>
          </select>
          <button class="btn btn-outline" onclick="cargarUsuarios()">↻</button>
        </div>
        <div class="users-topbar-right">
          <input type="text" class="add-input" id="newUser" placeholder="Nuevo usuario..." />
          <button class="btn btn-primary" onclick="agregarUsuario()">+ Agregar</button>
          <button class="btn btn-outline" onclick="abrirModalMasivo()">+ Masivo</button>
        </div>
      </div>
      <div class="add-msg" id="addMsg"></div>
      <div class="card">
        <div class="card-header">
          <span class="card-title">Usuarios registrados</span>
          <span style="font-family:'Space Mono',monospace;font-size:10px;color:var(--muted)" id="usersCount">—</span>
        </div>
        <div class="users-list" id="usersList">
          <div class="loading-state"><div class="spinner"></div>Cargando...</div>
        </div>
      </div>
    </div>

    <div class="tab-content" id="tab-grafico">
      <div class="card">
        <div class="card-header">
          <span class="card-title">Usos por día (últimos 14 días)</span>
          <button class="btn btn-outline" onclick="cargarGrafico()">↻</button>
        </div>
        <div class="chart-container" id="chartContainer">
          <div class="loading-state"><div class="spinner"></div>Cargando...</div>
        </div>
      </div>
    </div>

    <div class="tab-content" id="tab-logs">
      <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;">
        <button class="btn btn-outline" onclick="cargarLogs()">↻ Actualizar</button>
        <button class="btn btn-danger" onclick="limpiarLogs()">🗑 Limpiar</button>
      </div>
      <div class="card">
        <div class="card-header"><span class="card-title">Actividad reciente</span></div>
        <div id="logsList"><div class="loading-state"><div class="spinner"></div>Cargando...</div></div>
      </div>
    </div>
    <div class="modal-overlay" id="modalMasivo">
  <div class="modal">
    <h3>📋 Importar</h3>
    <p style="font-family:'Space Mono',monospace;font-size:10px;color:var(--muted);margin-bottom:12px;">Un usuario por línea</p>
    <textarea id="txtMasivo" placeholder="juan&#10;maria&#10;pedro&#10;ana" style="width:100%;background:var(--bg);border:1px solid var(--border);border-radius:2px;padding:10px 14px;color:var(--text);font-family:'Space Mono',monospace;font-size:12px;outline:none;resize:vertical;min-height:120px;"></textarea>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="cerrarModalMasivo()">Cancelar</button>
      <button class="btn btn-primary" onclick="agregarMasivo()">Agregar todos</button>
    </div>
  </div>
</div>
  </main>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3>📝 Nota del usuario</h3>
      <input type="hidden" id="modalUserId" />
      <textarea id="modalNota" placeholder="Ej: PC de Juan, laboratorio 3..."></textarea>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="cerrarModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="guardarNota()">Guardar</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import {
      getFirestore,
      collection,
      getDocs,
      doc,
      setDoc,
      updateDoc,
      deleteDoc,
      getDoc,
      writeBatch,
      orderBy,
      query,
      limit
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    
    const firebaseConfig = {
      apiKey: "AIzaSyCmbktRxMEB4Udn_bmmEqjrgOy1giKaPX0",
      authDomain: "ocultador-auth.firebaseapp.com",
      projectId: "ocultador-auth",
      storageBucket: "ocultador-auth.firebasestorage.app",
      messagingSenderId: "524437270376",
      appId: "1:524437270376:web:87f2184e42b26d3b29b0dd",
      databaseURL: "https://ocultador-auth-default-rtdb.europe-west1.firebasedatabase.app"
    };
    
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const rtdb = getDatabase(app);  // instancia para Realtime Database
    
    let todosUsuarios = [];


    // ── Tema ──────────────────────────────────────────────────────────────
    const temaGuardado = localStorage.getItem('tema') || 'dark';
    document.documentElement.setAttribute('data-theme', temaGuardado);
    document.getElementById('themeBtn').textContent = temaGuardado === 'dark' ? '☀️' : '🌙';

    window.toggleTema = function() {
      const actual = document.documentElement.getAttribute('data-theme');
      const nuevo  = actual === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', nuevo);
      document.getElementById('themeBtn').textContent = nuevo === 'dark' ? '☀️' : '🌙';
      localStorage.setItem('tema', nuevo);
    };

    // ── Auth ──────────────────────────────────────────────────────────────
    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = 'index.html'; return; }
      const adminDoc = await getDoc(doc(db, 'admins', user.email));
      if (!adminDoc.exists() || !adminDoc.data().activo) {
        await signOut(auth); window.location.href = 'index.html'; return;
      }
      document.getElementById('adminEmail').textContent = user.email;
      cargarUsuarios();
    });

    window.switchTab = function(tab, el) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.getElementById(`tab-${tab}`).classList.add('active');
      el.classList.add('active');
      if (tab === 'logs') cargarLogs();
      if (tab === 'grafico') cargarGrafico();
    };

    function formatearFecha(fechaStr) {
      if (!fechaStr) return null;
      const match = fechaStr.match(/(\d{4})-(\d{2})-(\d{2}) (\d{2}:\d{2})/);
      if (!match) return fechaStr;
      return `${match[3]}/${match[2]}/${match[1]} ${match[4]}`;
    }

    function calcularTiempoRestante(ultimoUso) {
      if (!ultimoUso) return null;
      const match = ultimoUso.match(/(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2}):(\d{2})/);
      if (!match) return null;
      const fechaUso = new Date(Date.UTC(
        parseInt(match[1]), parseInt(match[2]) - 1, parseInt(match[3]),
        parseInt(match[4]) + 5, parseInt(match[5]), parseInt(match[6])
      ));
      const expira = new Date(fechaUso.getTime() + 4 * 60 * 60 * 1000);
      const diff   = expira - new Date();
      if (diff <= 0) return "Expirando...";
      const horas = Math.floor(diff / 3600000);
      const mins  = Math.floor((diff % 3600000) / 60000);
      return `${horas}h ${mins}m restantes`;
    }

    window.cargarUsuarios = async function() {
      const lista = document.getElementById('usersList');
      lista.innerHTML = '<div class="loading-state"><div class="spinner"></div>Cargando...</div>';
      try {
        const snap = await getDocs(collection(db, 'usuarios'));
        todosUsuarios = [];
        snap.forEach(d => todosUsuarios.push({ id: d.id, ...d.data() }));
        actualizarStats(todosUsuarios);
        renderUsuarios(todosUsuarios);
      } catch (e) {
        lista.innerHTML = '<div class="empty-state">Error al cargar usuarios.</div>';
      }
    };

    function actualizarStats(users) {
      document.getElementById('statActivos').textContent   = users.filter(u => u.activo).length;
      document.getElementById('statEnUso').textContent     = users.filter(u => u.en_uso).length;
      document.getElementById('statInactivos').textContent = users.filter(u => !u.activo && !u.en_uso).length;
      document.getElementById('usersCount').textContent    = `${users.length} usuario${users.length !== 1 ? 's' : ''}`;
    }

    function renderUsuarios(users) {
      const lista = document.getElementById('usersList');
      if (users.length === 0) { lista.innerHTML = '<div class="empty-state">No hay usuarios registrados.</div>'; return; }
      lista.innerHTML = users.map(u => {
        const enUso      = u.en_uso === true;
        const badgeClass = u.activo ? 'badge-active' : enUso ? 'badge-inuse' : 'badge-inactive';
        const badgeText  = u.activo ? '● Activo' : enUso ? '⚡ En uso' : '○ Inactivo';
        const usos       = u.usos || 0;
        const fechaFmt   = formatearFecha(u.ultimo_uso);
        const tiempoRest = enUso ? calcularTiempoRestante(u.ultimo_uso) : null;
        const urgente    = tiempoRest && tiempoRest.startsWith('0h');
        const nota       = u.nota || '';
        const ip         = u.ultima_ip || '';
        const toggleBtn  = u.activo
          ? `<button class="btn btn-warning" onclick="toggleUsuario('${u.id}', false)">Desactivar</button>`
          : `<button class="btn btn-success" onclick="toggleUsuario('${u.id}', true)">Activar</button>`;
        const remoteBtns = enUso ? `
          <button class="btn btn-purple" onclick="enviarComando('${u.id}', 'ocultar')">🙈 Ocultar</button>
          <button class="btn btn-cyan" onclick="enviarComando('${u.id}', 'mostrar')">👁️ Mostrar</button>
          <button class="btn btn-danger" onclick="confirmarCerrar('${u.id}')">⏹ Cerrar</button>` : '';
        const eliminarBtn = !enUso
          ? `<button class="btn btn-danger" onclick="eliminarUsuario('${u.id}')">Eliminar</button>` : '';
        const timerHtml = tiempoRest
          ? `<div class="user-meta-item"><span class="timer-badge ${urgente ? 'urgent' : ''}">⏱ ${tiempoRest}</span></div>` : '';
        const ipHtml = ip
          ? `<div class="user-meta-item">🌐 <span>${ip}</span></div>` : '';
        return `
          <div class="user-row">
            <div class="user-top">
              <div class="user-avatar">${u.id.charAt(0).toUpperCase()}</div>
              <div class="user-main">
                <div class="user-name">${u.id}</div>
                ${nota ? `<div class="user-note">📝 ${nota}</div>` : ''}
              </div>
              <span class="status-badge ${badgeClass}">${badgeText}</span>
              <div class="user-actions">
                ${toggleBtn}
                <button class="btn btn-nota" onclick="abrirModal('${u.id}', \`${nota.replace(/`/g, "'")}\`)">${nota ? '📝 Nota' : '📝 Añadir nota'}</button>
                ${eliminarBtn}
                ${remoteBtns}
              </div>
            </div>
            <div class="user-bottom">
              <div class="user-meta-item">📅 <span>${fechaFmt ? `Último uso: ${fechaFmt}` : 'Sin uso registrado'}</span></div>
              <div class="user-meta-item">🔢 <span>Usos: ${usos}</span></div>
              ${timerHtml}
              ${ipHtml}
            </div>
          </div>`;
      }).join('');
    }

    window.ordenarUsuarios = function() {
      const criterio = document.getElementById('sortSelect').value;
      const sorted = [...todosUsuarios].sort((a, b) => {
        if (criterio === 'nombre')     return a.id.localeCompare(b.id);
        if (criterio === 'usos')       return (b.usos || 0) - (a.usos || 0);
        if (criterio === 'ultimo_uso') return (b.ultimo_uso || '').localeCompare(a.ultimo_uso || '');
        if (criterio === 'estado') {
          const orden = { 'true': 0, 'en_uso': 1, 'false': 2 };
          const ea = a.en_uso ? 'en_uso' : String(a.activo);
          const eb = b.en_uso ? 'en_uso' : String(b.activo);
          return (orden[ea] ?? 3) - (orden[eb] ?? 3);
        }
        return 0;
      });
      renderUsuarios(sorted);
    };

    window.filtrarUsuarios = function() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      renderUsuarios(todosUsuarios.filter(u => u.id.toLowerCase().includes(q)));
    };

    window.abrirModal = function(id, nota) {
      document.getElementById('modalUserId').value = id;
      document.getElementById('modalNota').value = nota;
      document.getElementById('modalOverlay').classList.add('show');
    };
    window.cerrarModal = function() { document.getElementById('modalOverlay').classList.remove('show'); };
    window.guardarNota = async function() {
      const id   = document.getElementById('modalUserId').value;
      const nota = document.getElementById('modalNota').value.trim();
      try {
        await updateDoc(doc(db, 'usuarios', id), { nota });
        showToast('Nota guardada ✓', 'success');
        cerrarModal(); cargarUsuarios();
      } catch (e) { showToast('Error al guardar nota', 'error'); }
    };
    document.getElementById('modalOverlay').addEventListener('click', function(e) { if (e.target === this) cerrarModal(); });

import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const rtdb = getDatabase(app);  // Asegúrate que app es la instancia de Firebase inicializada

window.enviarComando = async function(id, comando) {
  try {
    // Escribe el comando en Realtime Database para respuesta inmediata
    await set(ref(rtdb, `usuarios/${id}/comando`), comando);

    // Sincroniza el campo bloqueado en Firestore si quieres mantener estado consistente
    if (comando === 'ocultar') {
      await updateDoc(doc(db, 'usuarios', id), { bloqueado: true });
    } else if (comando === 'mostrar') {
      await updateDoc(doc(db, 'usuarios', id), { bloqueado: false });
    }

    // Mantén el registro de logs en Firestore como antes
    const ahora = new Date().toLocaleString('es-PE', { timeZone: 'America/Lima', hour12: false });
    await fetch(`https://firestore.googleapis.com/v1/projects/ocultador-auth/databases/(default)/documents/logs?key=AIzaSyCmbktRxMEB4Udn_bmmEqjrgOy1giKaPX0`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fields: { usuario: { stringValue: id }, fecha: { stringValue: ahora }, accion: { stringValue: comando } }})
    });

    showToast(`Comando "${comando}" enviado a "${id}"`, 'success');
  } catch (e) {
    showToast('Error al enviar comando', 'error');
  }
};




    window.confirmarCerrar = function(id) {
      if (!confirm(`¿Cerrar el .exe de "${id}" remotamente?`)) return;
      window.enviarComando(id, 'cerrar');
    };

    window.agregarUsuario = async function() {
      const input = document.getElementById('newUser');
      const nombre = input.value.trim();
      const msg = document.getElementById('addMsg');
      if (!nombre) { msg.style.color = 'var(--error)'; msg.textContent = '⚠ Ingresa un nombre'; return; }
      try {
        const ref = doc(db, 'usuarios', nombre);
        const existe = await getDoc(ref);
        if (existe.exists()) { msg.style.color = 'var(--error)'; msg.textContent = '⚠ Este usuario ya existe'; return; }
        await setDoc(ref, { activo: true, en_uso: false, usos: 0, comando: '', nota: '', ultima_ip: '', bloqueado: false });
        input.value = '';
        msg.style.color = 'var(--success)';
        msg.textContent = `✓ Usuario "${nombre}" creado`;
        showToast(`"${nombre}" agregado`, 'success');
        cargarUsuarios();
        setTimeout(() => msg.textContent = '', 3000);
      } catch (e) { msg.style.color = 'var(--error)'; msg.textContent = '✗ Error al crear usuario'; }
    };

    window.toggleUsuario = async function(id, estado) {
      try {
        const updateData = { activo: estado };
        if (estado) { updateData.en_uso = false; updateData.nota = ''; }
        await updateDoc(doc(db, 'usuarios', id), updateData);
        showToast(`"${id}" ${estado ? 'activado' : 'desactivado'}`, 'success');
        cargarUsuarios();
      } catch (e) { showToast('Error al actualizar', 'error'); }
    };

    window.eliminarUsuario = async function(id) {
      if (!confirm(`¿Eliminar al usuario "${id}"?`)) return;
      try {
        await deleteDoc(doc(db, 'usuarios', id));
        showToast(`"${id}" eliminado`, 'success');
        cargarUsuarios();
      } catch (e) { showToast('Error al eliminar', 'error'); }
    };

    window.resetearTodos = async function() {
      if (!confirm('¿Activar todos los usuarios que están en uso?')) return;
      try {
        const snap = await getDocs(collection(db, 'usuarios'));
        const batch = writeBatch(db);
        snap.forEach(d => {
          if (d.data().en_uso || !d.data().activo) {
            batch.update(doc(db, 'usuarios', d.id), { activo: true, en_uso: false, nota: '' });
          }
        });
        await batch.commit();
        showToast('Todos los usuarios reseteados ✓', 'success');
        cargarUsuarios();
      } catch (e) { showToast('Error al resetear', 'error'); }
    };

    window.eliminarTodosUsuarios = async function() {

      const confirmar = prompt(
        '⚠️ ESTA ACCIÓN ELIMINARÁ TODOS LOS USUARIOS.\n\nEscribe ELIMINAR para continuar:'
      );
    
      if (confirmar !== 'ELIMINAR') {
        showToast('Operación cancelada', 'error');
        return;
      }
    
      try {
    
        const snap = await getDocs(collection(db, 'usuarios'));
    
        if (snap.empty) {
          showToast('No hay usuarios para eliminar', 'error');
          return;
        }
    
        const batch = writeBatch(db);
    
        snap.forEach(docSnap => {
          batch.delete(doc(db, 'usuarios', docSnap.id));
        });
    
        await batch.commit();
    
        showToast('Todos los usuarios fueron eliminados ✓', 'success');
    
        cargarUsuarios();
    
      } catch (e) {
        showToast('Error al eliminar usuarios', 'error');
        console.error(e);
      }
    };

    window.abrirModalMasivo = function() {
  document.getElementById('txtMasivo').value = '';
  document.getElementById('modalMasivo').classList.add('show');
};

window.cerrarModalMasivo = function() {
  document.getElementById('modalMasivo').classList.remove('show');
};

window.agregarMasivo = async function() {
  const texto = document.getElementById('txtMasivo').value.trim();
  if (!texto) return;
  const nombres = texto.split('\n').map(n => n.trim()).filter(n => n.length > 0);
  if (nombres.length === 0) return;

  const btn = document.querySelector('#modalMasivo .btn-primary');
  btn.disabled = true;
  btn.textContent = 'Agregando...';

  let creados = 0;
  let duplicados = 0;

  for (const nombre of nombres) {
    try {
      const ref = doc(db, 'usuarios', nombre);
      const existe = await getDoc(ref);
      if (existe.exists()) { duplicados++; continue; }
      await setDoc(ref, { activo: true, en_uso: false, usos: 0, comando: '', nota: '', ultima_ip: '' });
      creados++;
    } catch (e) {}
  }

  btn.disabled = false;
  btn.textContent = 'Agregar todos';
  cerrarModalMasivo();
  cargarUsuarios();
  showToast(`✓ ${creados} creados, ${duplicados} duplicados`, 'success');
};
    
    window.cargarGrafico = async function() {
      const container = document.getElementById('chartContainer');
      container.innerHTML = '<div class="loading-state"><div class="spinner"></div>Cargando...</div>';
      try {
        const snap = await getDocs(query(collection(db, 'logs'), orderBy('fecha', 'desc'), limit(500)));
        const conteo = {};
        for (let i = 13; i >= 0; i--) {
          const d = new Date(); d.setDate(d.getDate() - i);
          const key = `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;
          conteo[key] = 0;
        }
        snap.forEach(d => {
          const fecha = d.data().fecha || '';
          const m1 = fecha.match(/(\d{4})-(\d{2})-(\d{2})/);
          const m2 = fecha.match(/(\d{2})\/(\d{2})\/(\d{4})/);
          let key = null;
          if (m1) key = `${m1[3]}/${m1[2]}`;
          else if (m2) key = `${m2[1]}/${m2[2]}`;
          if (key && conteo.hasOwnProperty(key)) conteo[key]++;
        });
        const dias = Object.keys(conteo);
        const vals = Object.values(conteo);
        const maxVal = Math.max(...vals, 1);
        if (vals.every(v => v === 0)) { container.innerHTML = '<div class="chart-empty">No hay datos en los últimos 14 días.</div>'; return; }
        container.innerHTML = `<div class="chart-inner"><div class="chart-bars" id="chartBars"></div><div style="display:flex;gap:4px" id="chartLabels"></div></div>`;
        const barsEl = document.getElementById('chartBars');
        const labelsEl = document.getElementById('chartLabels');
        dias.forEach((dia, i) => {
          const pct = (vals[i] / maxVal) * 100;
          const wrap = document.createElement('div');
          wrap.className = 'chart-bar-wrap';
          wrap.innerHTML = `<div class="chart-bar-val">${vals[i] > 0 ? vals[i] : ''}</div><div class="chart-bar" style="height:${pct}%" title="${dia}: ${vals[i]} usos"></div>`;
          barsEl.appendChild(wrap);
          const lbl = document.createElement('div');
          lbl.style.cssText = 'flex:1;font-family:Space Mono,monospace;font-size:8px;color:var(--muted);text-align:center;';
          lbl.textContent = dia;
          labelsEl.appendChild(lbl);
        });
      } catch (e) { container.innerHTML = '<div class="chart-empty">Error al cargar el gráfico.</div>'; }
    };

    window.cargarLogs = async function() {
      const lista = document.getElementById('logsList');
      lista.innerHTML = '<div class="loading-state"><div class="spinner"></div>Cargando...</div>';
      try {
        const snap = await getDocs(query(collection(db, 'logs'), orderBy('fecha', 'desc'), limit(100)));
        const logs = [];
        snap.forEach(d => logs.push({ id: d.id, ...d.data() }));
        if (logs.length === 0) { lista.innerHTML = '<div class="empty-state">No hay logs registrados.</div>'; return; }
        lista.innerHTML = logs.map(l => `
          <div class="log-row">
            <span class="log-user">${l.usuario}</span>
            <span class="log-action ${l.accion}">${l.accion}</span>
            <span class="log-date">${l.fecha}</span>
            ${l.ip ? `<span class="log-ip">🌐 ${l.ip}</span>` : ''}
          </div>`).join('');
      } catch (e) { lista.innerHTML = '<div class="empty-state">Error al cargar logs.</div>'; }
    };

    window.limpiarLogs = async function() {
      if (!confirm('¿Eliminar todos los logs?')) return;
      try {
        const snap = await getDocs(collection(db, 'logs'));
        const batch = writeBatch(db);
        snap.forEach(d => batch.delete(doc(db, 'logs', d.id)));
        await batch.commit();
        showToast('Logs eliminados ✓', 'success');
        cargarLogs();
      } catch (e) { showToast('Error al limpiar logs', 'error'); }
    };

    window.logout = async function() { await signOut(auth); window.location.href = 'index.html'; };

    window.showToast = function(msg, type) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.className = `toast ${type} show`;
      setTimeout(() => t.className = 'toast', 3000);
    };

    document.getElementById('newUser')?.addEventListener('keydown', e => {
      if (e.key === 'Enter') window.agregarUsuario();
    });
    
  </script>
