<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Panel Admin — Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0f; --surface: #12121a; --surface2: #1a1a25;
      --border: #1e1e2e; --accent: #e94560; --text: #e8e8f0;
      --muted: #555570; --success: #4ade80; --warning: #facc15; --error: #f87171;
    }
    body { background: var(--bg); color: var(--text); font-family: 'Syne', sans-serif; min-height: 100vh; }
    body::before { content: ''; position: fixed; inset: 0; background-image: linear-gradient(rgba(233,69,96,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(233,69,96,0.02) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; }
    nav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 32px; height: 60px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .nav-logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 16px; letter-spacing: 0.05em; text-transform: uppercase; }
    .nav-logo span { color: var(--accent); }
    .nav-right { display: flex; align-items: center; gap: 16px; }
    .admin-badge { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--muted); letter-spacing: 0.1em; }
    .nav-btn { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 6px 14px; border-radius: 2px; font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.1em; cursor: pointer; text-transform: uppercase; transition: all 0.2s; }
    .nav-btn:hover { border-color: var(--accent); color: var(--accent); }
    .tabs { display: flex; gap: 4px; margin-bottom: 24px; border-bottom: 1px solid var(--border); }
    .tab { background: transparent; border: none; color: var(--muted); padding: 10px 20px; font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; text-transform: uppercase; letter-spacing: 0.05em; }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    main { max-width: 960px; margin: 0 auto; padding: 40px 24px; }
    .page-header { margin-bottom: 28px; }
    h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 4px; }
    .page-sub { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }
    .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 2px; padding: 18px 20px; position: relative; overflow: hidden; }
    .stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; }
    .stat-card.green::before { background: var(--success); }
    .stat-card.yellow::before { background: var(--warning); }
    .stat-card.red::before { background: var(--error); }
    .stat-label { font-family: 'Space Mono', monospace; font-size: 9px; color: var(--muted); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 8px; }
    .stat-value { font-size: 28px; font-weight: 800; }
    .stat-card.green .stat-value { color: var(--success); }
    .stat-card.yellow .stat-value { color: var(--warning); }
    .stat-card.red .stat-value { color: var(--error); }
    .toolbar { display: flex; gap: 10px; margin-bottom: 16px; align-items: center; flex-wrap: wrap; }
    .search-input { flex: 1; min-width: 200px; background: var(--surface); border: 1px solid var(--border); border-radius: 2px; padding: 9px 14px; color: var(--text); font-family: 'Space Mono', monospace; font-size: 12px; outline: none; transition: border-color 0.2s; }
    .search-input:focus { border-color: var(--accent); }
    .search-input::placeholder { color: var(--muted); }
    .btn { padding: 9px 16px; border-radius: 2px; font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.1em; cursor: pointer; border: 1px solid; transition: all 0.2s; text-transform: uppercase; white-space: nowrap; }
    .btn-primary { background: var(--accent); color: white; border-color: var(--accent); }
    .btn-primary:hover { background: #c73652; }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-outline { background: transparent; color: var(--muted); border-color: var(--border); }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
    .btn-success { background: transparent; border-color: var(--success); color: var(--success); }
    .btn-success:hover { background: rgba(74,222,128,0.1); }
    .btn-warning { background: transparent; border-color: var(--warning); color: var(--warning); }
    .btn-warning:hover { background: rgba(250,204,21,0.1); }
    .btn-danger { background: transparent; border-color: var(--error); color: var(--error); }
    .btn-danger:hover { background: rgba(248,113,113,0.1); }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 2px; margin-bottom: 16px; }
    .card-header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .card-title { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--muted); letter-spacing: 0.15em; text-transform: uppercase; }
    .add-row { display: flex; gap: 10px; padding: 16px 24px; }
    .add-row input { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 2px; padding: 9px 14px; color: var(--text); font-family: 'Space Mono', monospace; font-size: 12px; outline: none; transition: border-color 0.2s; }
    .add-row input:focus { border-color: var(--accent); }
    .add-row input::placeholder { color: var(--muted); }
    .add-msg { padding: 0 24px 12px; font-family: 'Space Mono', monospace; font-size: 11px; min-height: 18px; }
    .users-list { padding: 4px 0; }
    .user-row { display: flex; align-items: center; padding: 12px 24px; border-bottom: 1px solid var(--border); transition: background 0.15s; }
    .user-row:last-child { border-bottom: none; }
    .user-row:hover { background: var(--surface2); }
    .user-avatar { width: 32px; height: 32px; border-radius: 2px; background: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; color: white; margin-right: 14px; flex-shrink: 0; text-transform: uppercase; }
    .user-info { flex: 1; min-width: 0; }
    .user-name { font-weight: 700; font-size: 13px; text-transform: capitalize; }
    .user-meta { font-family: 'Space Mono', monospace; font-size: 9px; color: var(--muted); margin-top: 3px; letter-spacing: 0.03em; }
    .status-badge { font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 8px; border-radius: 2px; margin-right: 12px; white-space: nowrap; flex-shrink: 0; }
    .badge-active { background: rgba(74,222,128,0.1); color: var(--success); border: 1px solid rgba(74,222,128,0.2); }
    .badge-inuse { background: rgba(250,204,21,0.1); color: var(--warning); border: 1px solid rgba(250,204,21,0.2); }
    .badge-inactive { background: rgba(248,113,113,0.1); color: var(--error); border: 1px solid rgba(248,113,113,0.2); }
    .user-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .empty-state { text-align: center; padding: 48px 24px; color: var(--muted); font-family: 'Space Mono', monospace; font-size: 12px; }
    .loading-state { text-align: center; padding: 48px 24px; color: var(--muted); font-family: 'Space Mono', monospace; font-size: 12px; }
    .spinner { width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .log-row { display: flex; align-items: center; padding: 10px 24px; border-bottom: 1px solid var(--border); font-family: 'Space Mono', monospace; font-size: 11px; gap: 16px; }
    .log-row:last-child { border-bottom: none; }
    .log-row:hover { background: var(--surface2); }
    .log-user { color: var(--accent); font-weight: 700; min-width: 120px; }
    .log-action { color: var(--success); min-width: 60px; }
    .log-date { color: var(--muted); font-size: 10px; }
    .toast { position: fixed; bottom: 24px; right: 24px; background: var(--surface); border: 1px solid var(--border); border-radius: 2px; padding: 12px 20px; font-family: 'Space Mono', monospace; font-size: 12px; transform: translateY(80px); opacity: 0; transition: all 0.3s cubic-bezier(0.16,1,0.3,1); z-index: 999; }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { border-left: 3px solid var(--success); color: var(--success); }
    .toast.error { border-left: 3px solid var(--error); color: var(--error); }
    .reset-bar { background: rgba(233,69,96,0.05); border: 1px solid rgba(233,69,96,0.2); border-radius: 2px; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .reset-bar-text { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--muted); }
  </style>
</head>
<body>
  <nav>
    <div class="nav-logo">🛡️ OCULT<span>ADOR</span></div>
    <div class="nav-right">
      <span class="admin-badge" id="adminEmail">—</span>
      <button class="nav-btn" onclick="logout()">Salir</button>
    </div>
  </nav>

  <main>
    <div class="page-header">
      <h1>Panel de administración</h1>
      <p class="page-sub">Gestión de usuarios y actividad</p>
    </div>

    <!-- Stats -->
    <div class="stats-row" id="statsRow">
      <div class="stat-card green"><div class="stat-label">Activos</div><div class="stat-value" id="statActivos">—</div></div>
      <div class="stat-card yellow"><div class="stat-label">En uso</div><div class="stat-value" id="statEnUso">—</div></div>
      <div class="stat-card red"><div class="stat-label">Inactivos</div><div class="stat-value" id="statInactivos">—</div></div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" onclick="switchTab('usuarios')">Usuarios</button>
      <button class="tab" onclick="switchTab('logs')">Logs de actividad</button>
    </div>

    <!-- Tab Usuarios -->
    <div class="tab-content active" id="tab-usuarios">
      <!-- Reset bar -->
      <div class="reset-bar">
        <span class="reset-bar-text">⚡ Resetear todos los usuarios en uso a activos de un solo clic</span>
        <button class="btn btn-warning" onclick="resetearTodos()">↺ Resetear todos</button>
      </div>

      <!-- Agregar usuario -->
      <div class="card">
        <div class="card-header"><span class="card-title">Agregar nuevo usuario</span></div>
        <div class="add-row">
          <input type="text" id="newUser" placeholder="nombre de usuario (ej: Boris)" />
          <button class="btn btn-primary" onclick="agregarUsuario()">+ Agregar</button>
        </div>
        <div class="add-msg" id="addMsg"></div>
      </div>

      <!-- Toolbar -->
      <div class="toolbar">
        <input type="text" class="search-input" id="searchInput" placeholder="Buscar usuario..." oninput="filtrarUsuarios()" />
        <button class="btn btn-outline" onclick="cargarUsuarios()">↻ Actualizar</button>
      </div>

      <!-- Lista -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">Usuarios registrados</span>
          <span style="font-family:'Space Mono',monospace;font-size:10px;color:var(--muted)" id="usersCount">—</span>
        </div>
        <div class="users-list" id="usersList">
          <div class="loading-state"><div class="spinner"></div>Cargando...</div>
        </div>
      </div>
    </div>

    <!-- Tab Logs -->
    <div class="tab-content" id="tab-logs">
      <div class="toolbar">
        <button class="btn btn-outline" onclick="cargarLogs()">↻ Actualizar logs</button>
        <button class="btn btn-danger" onclick="limpiarLogs()">🗑 Limpiar logs</button>
      </div>
      <div class="card">
        <div class="card-header"><span class="card-title">Actividad reciente</span></div>
        <div id="logsList"><div class="loading-state"><div class="spinner"></div>Cargando logs...</div></div>
      </div>
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, getDocs, doc, setDoc, updateDoc, deleteDoc, getDoc, writeBatch, orderBy, query, limit, deleteField } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCmbktRxMEB4Udn_bmmEqjrgOy1giKaPX0",
      authDomain: "ocultador-auth.firebaseapp.com",
      projectId: "ocultador-auth",
      storageBucket: "ocultador-auth.firebasestorage.app",
      messagingSenderId: "524437270376",
      appId: "1:524437270376:web:87f2184e42b26d3b29b0dd"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    let todosUsuarios = [];

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = 'index.html'; return; }
      const adminDoc = await getDoc(doc(db, 'admins', user.email));
      if (!adminDoc.exists() || !adminDoc.data().activo) {
        await signOut(auth); window.location.href = 'index.html'; return;
      }
      document.getElementById('adminEmail').textContent = user.email;
      cargarUsuarios();
    });

    window.switchTab = function(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.getElementById(`tab-${tab}`).classList.add('active');
      event.target.classList.add('active');
      if (tab === 'logs') cargarLogs();
    };

    window.cargarUsuarios = async function() {
      const lista = document.getElementById('usersList');
      lista.innerHTML = '<div class="loading-state"><div class="spinner"></div>Cargando...</div>';
      try {
        const snap = await getDocs(collection(db, 'usuarios'));
        todosUsuarios = [];
        snap.forEach(d => todosUsuarios.push({ id: d.id, ...d.data() }));
        actualizarStats(todosUsuarios);
        renderUsuarios(todosUsuarios);
      } catch (e) {
        lista.innerHTML = '<div class="empty-state">Error al cargar usuarios.</div>';
      }
    };

    function actualizarStats(users) {
      document.getElementById('statActivos').textContent   = users.filter(u => u.activo).length;
      document.getElementById('statEnUso').textContent     = users.filter(u => u.en_uso).length;
      document.getElementById('statInactivos').textContent = users.filter(u => !u.activo && !u.en_uso).length;
      document.getElementById('usersCount').textContent    = `${users.length} usuario${users.length !== 1 ? 's' : ''}`;
    }

    function renderUsuarios(users) {
      const lista = document.getElementById('usersList');
      if (users.length === 0) {
        lista.innerHTML = '<div class="empty-state">No hay usuarios registrados.</div>';
        return;
      }
      lista.innerHTML = users.map(u => {
        const enUso  = u.en_uso === true;
        const badgeClass = u.activo ? 'badge-active' : enUso ? 'badge-inuse' : 'badge-inactive';
        const badgeText  = u.activo ? '● Activo' : enUso ? '⚡ En uso' : '○ Inactivo';
        const usos       = u.usos || 0;
        const ultimoUso  = u.ultimo_uso ? `Último uso: ${u.ultimo_uso}` : 'Sin uso registrado';
        const toggleBtn  = u.activo
          ? `<button class="btn btn-warning" onclick="toggleUsuario('${u.id}', false)">Desactivar</button>`
          : `<button class="btn btn-success" onclick="toggleUsuario('${u.id}', true)">Activar</button>`;
        return `
          <div class="user-row">
            <div class="user-avatar">${u.id.charAt(0)}</div>
            <div class="user-info">
              <div class="user-name">${u.id}</div>
              <div class="user-meta">${ultimoUso} · Usos totales: ${usos}</div>
            </div>
            <span class="status-badge ${badgeClass}">${badgeText}</span>
            <div class="user-actions">
              ${toggleBtn}
              <button class="btn btn-danger" onclick="eliminarUsuario('${u.id}')">Eliminar</button>
            </div>
          </div>`;
      }).join('');
    }

    window.filtrarUsuarios = function() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const filtrados = todosUsuarios.filter(u => u.id.toLowerCase().includes(q));
      renderUsuarios(filtrados);
    };

    window.agregarUsuario = async function() {
      const input = document.getElementById('newUser');
      const nombre = input.value.trim();
      const msg = document.getElementById('addMsg');
      if (!nombre) { msg.style.color = 'var(--error)'; msg.textContent = '⚠ Ingresa un nombre'; return; }
      try {
        const ref = doc(db, 'usuarios', nombre);
        const existe = await getDoc(ref);
        if (existe.exists()) { msg.style.color = 'var(--error)'; msg.textContent = '⚠ Este usuario ya existe'; return; }
        await setDoc(ref, { activo: true, en_uso: false, usos: 0 });
        input.value = '';
        msg.style.color = 'var(--success)';
        msg.textContent = `✓ Usuario "${nombre}" creado`;
        showToast(`"${nombre}" agregado`, 'success');
        cargarUsuarios();
        setTimeout(() => msg.textContent = '', 3000);
      } catch (e) { msg.style.color = 'var(--error)'; msg.textContent = '✗ Error al crear usuario'; }
    };

    window.toggleUsuario = async function(id, estado) {
      try {
        const updateData = { activo: estado };
        if (estado) updateData.en_uso = false;
        await updateDoc(doc(db, 'usuarios', id), updateData);
        showToast(`"${id}" ${estado ? 'activado' : 'desactivado'}`, 'success');
        cargarUsuarios();
      } catch (e) { showToast('Error al actualizar', 'error'); }
    };

    window.eliminarUsuario = async function(id) {
      if (!confirm(`¿Eliminar al usuario "${id}"?`)) return;
      try {
        await deleteDoc(doc(db, 'usuarios', id));
        showToast(`"${id}" eliminado`, 'success');
        cargarUsuarios();
      } catch (e) { showToast('Error al eliminar', 'error'); }
    };

    window.resetearTodos = async function() {
      if (!confirm('¿Activar todos los usuarios que están en uso?')) return;
      try {
        const snap = await getDocs(collection(db, 'usuarios'));
        const batch = writeBatch(db);
        snap.forEach(d => {
          if (d.data().en_uso || !d.data().activo) {
            batch.update(doc(db, 'usuarios', d.id), { activo: true, en_uso: false });
          }
        });
        await batch.commit();
        showToast('Todos los usuarios reseteados ✓', 'success');
        cargarUsuarios();
      } catch (e) { showToast('Error al resetear', 'error'); }
    };

    window.cargarLogs = async function() {
      const lista = document.getElementById('logsList');
      lista.innerHTML = '<div class="loading-state"><div class="spinner"></div>Cargando logs...</div>';
      try {
        const snap = await getDocs(query(collection(db, 'logs'), orderBy('fecha', 'desc'), limit(100)));
        const logs = [];
        snap.forEach(d => logs.push({ id: d.id, ...d.data() }));
        if (logs.length === 0) {
          lista.innerHTML = '<div class="empty-state">No hay logs registrados.</div>';
          return;
        }
        lista.innerHTML = logs.map(l => `
          <div class="log-row">
            <span class="log-user">${l.usuario}</span>
            <span class="log-action">${l.accion}</span>
            <span class="log-date">${l.fecha}</span>
          </div>`).join('');
      } catch (e) {
        lista.innerHTML = '<div class="empty-state">Error al cargar logs.</div>';
      }
    };

    window.limpiarLogs = async function() {
      if (!confirm('¿Eliminar todos los logs? Esta acción no se puede deshacer.')) return;
      try {
        const snap = await getDocs(collection(db, 'logs'));
        const batch = writeBatch(db);
        snap.forEach(d => batch.delete(doc(db, 'logs', d.id)));
        await batch.commit();
        showToast('Logs eliminados ✓', 'success');
        cargarLogs();
      } catch (e) { showToast('Error al limpiar logs', 'error'); }
    };

    window.logout = async function() { await signOut(auth); window.location.href = 'index.html'; };

    window.showToast = function(msg, type) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.className = `toast ${type} show`;
      setTimeout(() => t.className = 'toast', 3000);
    };

    document.getElementById('newUser')?.addEventListener('keydown', e => {
      if (e.key === 'Enter') window.agregarUsuario();
    });
  </script>
</body>
</html>
